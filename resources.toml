[[deployment]]
name = "backblaze-help"
tags = ["backblaze"]
[deployment.config]
server = "demo-server"
image.type = "Build"
image.params.build = "backblaze-cli"
redeploy_on_build = true
network = "none"

##

[[build]]
name = "backblaze-cli"
tags = ["backblaze"]
[build.config]
builder = "local"
version = "4.3.2"
auto_increment_version = false
links = [
  "https://github.com/Backblaze/B2_Command_Line_Tool/releases"
]
dockerfile = """
FROM debian:bookworm-slim

WORKDIR /usr/local/bin

# Version arg is automatically populated by komodo build.
ARG VERSION

RUN apt-get update && \
  apt-get install -y \
  curl \
  && \
  rm -rf /var/lib/apt/lists/* && \
  curl -L --output b2 "https://github.com/Backblaze/B2_Command_Line_Tool/releases/download/v$VERSION/b2-linux" && \
  chmod +x ./b2

CMD [ "b2", "--help" ]
"""

##

[[builder]]
name = "local"
[builder.config]
type = "Server"
params.server_id = "demo-server"

##

[[user_group]]
name = "Users"
users = ["demo", "komodo"]
all.Stack = "Execute"
all.Deployment = "Execute"
all.Procedure = "None"
all.Repo = "Execute"
all.Server = "None"
permissions = []